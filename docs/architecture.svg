<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Only an approved draft reaches the client"><rect width="760" height="512" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa0a6"/></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">Only an approved draft reaches the client</text><path d="M224.0 110H280.0" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M480.0 110H536.0" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M636 146.0V214.0" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M636 286.0V354.0" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M636 74.0V52H124V74.0" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M124 146.0V214.0" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#arrow)"/><path d="M224.0 250H280.0" fill="none" stroke="#9aa0a6" stroke-width="1.25" marker-end="url(#arrow)"/><rect x="24.0" y="74.0" width="200" height="72" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/><text x="124" y="98.0" text-anchor="middle" font-weight="600" fill="#1f2328">Google Sheet</text><text x="124" y="114.0" text-anchor="middle" font-size="11.5" fill="#57606a">roster, rules, states,</text><text x="124" y="130.0" text-anchor="middle" font-size="11.5" fill="#57606a">and the alerts log</text><rect x="280.0" y="74.0" width="200" height="72" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/><text x="380" y="98.0" text-anchor="middle" font-weight="600" fill="#1f2328">1 · Daily check</text><text x="380" y="114.0" text-anchor="middle" font-size="11.5" fill="#57606a">Applies every rule to the</text><text x="380" y="130.0" text-anchor="middle" font-size="11.5" fill="#57606a">roster each morning</text><rect x="536.0" y="74.0" width="200" height="72" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/><text x="636" y="98.0" text-anchor="middle" font-weight="600" fill="#1f2328">2 · Review and send</text><text x="636" y="114.0" text-anchor="middle" font-size="11.5" fill="#57606a">One run per alert: draft,</text><text x="636" y="130.0" text-anchor="middle" font-size="11.5" fill="#57606a">fact check, log, ask</text><rect x="536.0" y="214.0" width="200" height="72" rx="8" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="2"/><text x="636" y="238.0" text-anchor="middle" font-weight="600" fill="#1f2328">#radar-review</text><text x="636" y="254.0" text-anchor="middle" font-size="11.5" fill="#1f2328">A Spine teammate approves</text><text x="636" y="270.0" text-anchor="middle" font-size="11.5" fill="#1f2328">or declines each draft</text><rect x="536.0" y="354.0" width="200" height="72" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/><text x="636" y="378.0" text-anchor="middle" font-weight="600" fill="#1f2328">#client-acme</text><text x="636" y="394.0" text-anchor="middle" font-size="11.5" fill="#57606a">Gets only approved</text><text x="636" y="410.0" text-anchor="middle" font-size="11.5" fill="#57606a">messages</text><rect x="24.0" y="214.0" width="200" height="72" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/><text x="124" y="238.0" text-anchor="middle" font-weight="600" fill="#1f2328">4 · Prospect signals</text><text x="124" y="254.0" text-anchor="middle" font-size="11.5" fill="#57606a">Reads public Ashby job</text><text x="124" y="270.0" text-anchor="middle" font-size="11.5" fill="#57606a">boards once a day</text><rect x="280.0" y="214.0" width="200" height="72" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.25"/><text x="380" y="238.0" text-anchor="middle" font-weight="600" fill="#1f2328">#prospect-signals</text><text x="380" y="254.0" text-anchor="middle" font-size="11.5" fill="#57606a">A person edits and sends</text><text x="380" y="270.0" text-anchor="middle" font-size="11.5" fill="#57606a">any outreach note</text><rect x="24" y="448" width="712" height="40" rx="8" fill="#f6f8fa" stroke="#9aa0a6" stroke-width="1.25"/><text x="380" y="473" text-anchor="middle" fill="#1f2328">3 · Error handler: a failure anywhere posts to #radar-errors</text><text x="252" y="102" text-anchor="middle" font-size="11.5" fill="#57606a">reads</text><text x="508" y="102" text-anchor="middle" font-size="11.5" fill="#57606a">alerts</text><text x="646" y="184" text-anchor="start" font-size="11.5" fill="#57606a">draft</text><text x="646" y="324" text-anchor="start" font-size="11.5" fill="#57606a">approved</text><text x="380" y="45" text-anchor="middle" font-size="11.5" fill="#57606a">logs each alert</text><text x="134" y="184" text-anchor="start" font-size="11.5" fill="#57606a">reads rules</text><text x="252" y="242" text-anchor="middle" font-size="11.5" fill="#57606a">signals</text></svg>